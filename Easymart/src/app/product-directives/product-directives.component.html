<h1>Structural & Custom directive</h1>
<div class="product-list">
  <h2>Product List</h2>

  <div *ngFor="let p of products"  class="product-item" appHighlight >
    <h3>{{ p.name }}</h3>
    <p >Price: {{ p.price | currency:'USD' }}</p>

    <p>
      {{ p.stock > 0 ? 'In Stock' : 'Out of Stock' }}
    </p>
  </div>
</div>
<hr/>
