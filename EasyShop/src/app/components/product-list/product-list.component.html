<h2 class="text-center">Product List</h2>
<div class="container">
  <div class="d-flex flex-wrap justify-content-center">
    <div *ngFor="let product of products" class="card m-3 p-2" style="width: 18rem;" style="display: inline-block;">
      <img [src]="product.image" height="100px" width="75px" class="card-img-top" alt="{{ product.title }}">
      <div class="card-body">
        <h5 class="card-title">{{ product.title }}</h5>
        <p class="card-text">Price: ${{ product.price }}</p>
      </div>
    </div>
  </div>
</div>
