<div class="container">
  <h2>Available Electronic Items</h2>
  <div class="row">
    <div class="col-md-4" *ngFor="let item of electronicItems">
      <div class="card">
        <img [src]="item.image" class="card-img-top" alt="Product Image">
        <div class="card-body">
          <h5 class="card-title">{{ item.name }}</h5>
          <!-- <p class="card-text">${{ item.price }}</p> -->
          <a [routerLink]="['/electronic-items',item.id]" class="btn btn-primary">View Details</a>
          <!-- { path: 'electronic-items/:id', component: ElectronicItemDetailComponent }, // ✅ R -->
         <!--  -->
        </div>
      </div>
    </div>
  </div>
</div>
