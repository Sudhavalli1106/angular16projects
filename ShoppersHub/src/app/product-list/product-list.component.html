<!-- product-list.component.html -->
<div class="product-list">
  <mat-grid-list cols="3" rowHeight="250px" gutterSize="16px">
    <mat-grid-tile *ngFor="let product of products">
      <mat-card>
        <mat-card-header>
          <mat-card-title>{{ product.name }}</mat-card-title>
        </mat-card-header>
        <img mat-card-image [src]="product.image" alt="Product image">
        <mat-card-content>
          <p>{{ product.description }}</p>
        </mat-card-content>
     
        <mat-card-actions>
          <button mat-raised-button color="primary" (click)="addToCart(product)">
            Add to Cart
          </button>
        </mat-card-actions>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>
</div>
